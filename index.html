<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>Votação · Castello de Ledebour</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1f3a5f; color: #fff; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  .sub { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #d9c08d; }
  h1 { margin: 4px 0 18px; font-size: 24px; }
  .spin { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; margin: 0 auto 14px; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #msg { opacity: .9; max-width: 340px; margin: 0 auto; }
</style>
</head>
<body>
<div>
  <div class="sub">Condomínio</div>
  <h1>Castello de Ledebour</h1>
  <div class="spin"></div>
  <div id="msg">Abrindo a votação…</div>
</div>
<script>
// Link fixo: descobre o endereço atual da votação e redireciona.
// Fontes (da mais antiga para a mais nova): link gravado nesta página, link.json no GitHub, API do GitHub.
// Testa todas e vai para o primeiro endereço que responder.
const REPO = 'tonleal/votacao';
const BAKED = '';
const msg = document.getElementById('msg');

async function candidates() {
  const list = [BAKED];
  const t = Date.now();
  const sources = [
    `https://raw.githubusercontent.com/${REPO}/main/link.json?t=${t}`,
    `https://api.github.com/repos/${REPO}/contents/link.json?ref=main&t=${t}`,
  ];
  await Promise.all(sources.map(async (u) => {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      let d = await r.json();
      if (d.content) d = JSON.parse(atob(d.content.replace(/\n/g, '')));
      if (d.url) list.push(d.url);
    } catch {}
  }));
  return [...new Set(list.filter((x) => /^https:\/\//.test(x)))];
}

async function alive(url) {
  const c = new AbortController();
  setTimeout(() => c.abort(), 6000);
  try { const r = await fetch(url + 'api/state', { cache: 'no-store', signal: c.signal }); return r.ok; } catch { return false; }
}

async function go() {
  const list = await candidates();
  const ok = await Promise.any(list.map(async (u) => { if (await alive(u)) return u; throw 0; })).catch(() => null);
  if (ok) { msg.textContent = 'Abrindo a votação…'; location.replace(ok); return; }
  msg.textContent = 'A votação ainda não está no ar. Esta página tenta de novo sozinha a cada 10 segundos.';
  setTimeout(go, 10000);
}
go();
</script>
</body>
</html>
